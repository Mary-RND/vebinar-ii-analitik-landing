name: Deploy surgery landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Surgery landing/site/**"
      - ".github/workflows/deploy-surgery-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-surgery"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Surgery landing/site/package-lock.json"
      - name: Install dependencies
        working-directory: "Surgery landing/site"
        run: npm ci --legacy-peer-deps
      - name: Build static export
        working-directory: "Surgery landing/site"
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Surgery landing/site/out"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
