          - paragraph [ref=f10e136]: Прежде чем взять в руки скальпель, нужно услышать, зачем человек пришёл. Иногда за запросом на изменение формы стоит желание вернуться к себе — той, какой была до родов, до болезни, до времени. Иногда — впервые себя узнать.
          - paragraph [ref=f10e137]: Моя задача — не переделать. Моя задача — провести вас от вопроса «а можно ли?» к уверенному «да, именно так».
