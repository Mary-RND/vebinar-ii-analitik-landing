          - paragraph [ref=f5e272]: Первые дни — покой и компрессионное бельё, к концу первой недели большинство возвращаются к обычной активности. Полный шов заживает в течение месяца, финальная форма оценивается через несколько месяцев, когда спадает отёк. Точный план зависит от техники и даётся индивидуально.
        - generic [ref=f5e274]:
          - button "Можно ли совместить несколько зон в одну операцию?" [ref=f5e275]
          - paragraph [ref=f5e280]: Да, часто это даже предпочтительнее — один наркоз, одна реабилитация. Например, абдоминопластика с липосакцией или коррекция груди вместе с животом. Оптимальный объём обсуждается после осмотра и диагностики.
        - generic [ref=f5e282]:
