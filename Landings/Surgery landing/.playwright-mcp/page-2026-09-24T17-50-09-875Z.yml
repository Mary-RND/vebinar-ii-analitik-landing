          - paragraph [ref=f4e272]: Первые дни — покой и компрессионное бельё, к концу первой недели большинство возвращаются к обычной активности. Полный шов заживает в течение месяца, финальная форма оценивается через несколько месяцев, когда спадает отёк. Точный план зависит от техники и даётся индивидуально.
        - generic [ref=f4e274]:
