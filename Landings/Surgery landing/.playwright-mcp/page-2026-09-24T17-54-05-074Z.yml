          - paragraph [ref=f9e272]: Первые дни — покой и компрессионное бельё, к концу первой недели большинство возвращаются к обычной активности. Полный шов заживает в течение месяца, финальная форма оценивается через несколько месяцев, когда спадает отёк. Точный план зависит от техники и даётся индивидуально.
        - generic [ref=f9e274]:
          - button "Можно ли совместить несколько зон в одну операцию?" [ref=f9e275]
          - paragraph [ref=f9e280]: Да, часто это даже предпочтительнее — один наркоз, одна реабилитация. Например, абдоминопластика с липосакцией или коррекция груди вместе с животом. Оптимальный объём обсуждается после осмотра и диагностики.
        - generic [ref=f9e282]:
          - button "Чем мужская пластика отличается от женской?" [ref=f9e283]
          - paragraph [ref=f9e288]: Другими пропорциями, толщиной и распределением кожи и жировой ткани, другими линейками эстетики результата и расположением разрезов. По этой причине подход и техники подбираются отдельно для мужчин и женщин.
        - generic [ref=f9e290]:
