          - paragraph [ref=f9e180]: Послеродовая пластика — это не одна операция, а маршрут. Часто он включает работу с животом (диастаз, кожа), грудью (форма, объём), бёдрами. Мы составляем его вместе, учитывая, кормите ли вы ещё, как давно были роды, какие у вас планы на будущее.
          - paragraph [ref=f9e181]: Никто не торопит. Никто не оценивает.
