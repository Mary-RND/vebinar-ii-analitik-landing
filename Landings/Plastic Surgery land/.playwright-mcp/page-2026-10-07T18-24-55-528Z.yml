        - generic [ref=f1e346]:
          - heading [level=2] [ref=f1e347]:
            - text: Cache Performance
            - link "#" [ref=f1e348] [cursor=pointer]:
              - /url: "#cache-performance"
          - paragraph [ref=f1e349]: UNPKG is a mirror of everything on npm. Every file on npm is automatically available on unpkg.com within minutes of being published.
          - paragraph [ref=f1e350]:
            - text: Additionally, UNPKG runs on
            - link "Cloudflare's" [ref=f1e351] [cursor=pointer]:
              - /url: https://www.cloudflare.com
            - text: global edge network using
            - link "Cloudflare Workers" [ref=f1e352] [cursor=pointer]:
              - /url: https://workers.cloudflare.com/
            - text: ", which allow UNPKG to serve billions of requests every day with low latency from hundreds of locations worldwide. The \"serverless\" nature of Cloudflare Workers also allows UNPKG to scale immediately to satisfy sudden spikes in traffic."
          - paragraph [ref=f1e353]: Files are cached on Cloudflare's global content-delivery network based on their permanent URL, which includes the npm package version. This works because npm does not allow package authors to overwrite a package that has already been published with a different one at the same version number.
          - paragraph [ref=f1e354]:
            - text: URLs that do not specify a fully resolved package version number redirect to one that does. This is the
            - code [ref=f1e355]: latest
            - text: version when none is specified, or the maximum satisfying version when a semver range is given. For the best chance of getting a cache hit, use the full package version number and file path in your UNPKG URLs instead of an npm tag or semver range.
          - paragraph [ref=f1e356]:
            - text: For example, a URL like
            - link "unpkg.com/preact@10" [ref=f1e357] [cursor=pointer]:
              - /url: /preact@10
            - text: will not be a direct cache hit because UNPKG needs to resolve the version
            - code [ref=f1e358]: "10"
            - text: to the latest matching version of Preact published with that major, plus it needs to figure out which file to serve. So a short URL like this will always cause a redirect to the permanent URL for that resource. If you need to make sure you hit the cache, use a fixed version number and the full file path, like
            - link "unpkg.com/preact@10.5.0/dist/preact.min.js" [ref=f1e359] [cursor=pointer]:
              - /url: /preact@10.5.0/dist/preact.min.js
            - text: .
