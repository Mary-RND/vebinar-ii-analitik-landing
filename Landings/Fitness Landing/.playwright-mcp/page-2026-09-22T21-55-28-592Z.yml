        - paragraph [ref=f123e331]: "В нашей системе нет понятия «сорвался». Есть правило 80/20: 80% времени вы питаетесь здорово, 20% — едите вкусняшки. Если вы съели пиццу, мы не ругаем вас, а корректируем план на следующий день. Без чувства вины."
      - generic [ref=f123e332]:
        - button "Вебинар правда бесплатный? В чём подвох?" [ref=f123e333] [cursor=pointer]
        - paragraph [ref=f123e335]: Подвоха нет. Это 60-минутный онлайн-эфир. Мы разбираем привычки, считаем калории и даём план на неделю. Если вам понравится наш подход — вы присоединитесь к программе. Если нет — план останется у вас, и мы расстанемся друзьями.
