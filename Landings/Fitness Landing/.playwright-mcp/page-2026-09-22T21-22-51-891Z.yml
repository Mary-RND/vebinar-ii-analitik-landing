  - generic [ref=f120e76]:
    - generic [ref=f120e77]:
      - heading "Знакомо?" [level=2] [ref=f120e78]
      - paragraph [ref=f120e79]: Мы знаем, как это бывает. Вы ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал... Хватает на две недели. Потом стресс на работе, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f120e80]:
      - article [ref=f120e81]:
        - generic [ref=f120e82]: ↻
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f120e83]
        - paragraph [ref=f120e84]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f120e85]:
        - generic [ref=f120e86]: ⏱
        - heading "«Нет времени и сил»" [level=3] [ref=f120e87]
        - paragraph [ref=f120e88]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f120e89]:
        - generic [ref=f120e90]: ◔
        - heading "«Стыдно и страшно»" [level=3] [ref=f120e91]
        - paragraph [ref=f120e92]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я... Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f120e94]:
      - strong [ref=f120e95]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
  - generic [ref=f120e97]:
