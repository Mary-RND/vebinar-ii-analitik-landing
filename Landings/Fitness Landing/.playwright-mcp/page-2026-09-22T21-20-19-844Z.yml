        - generic [ref=f119e104]: ✓
        - heading "Никаких запретов" [level=3] [ref=f119e105]
        - paragraph [ref=f119e106]: Нутрициолог собирает рацион из ваших любимых продуктов. Вы худеете, не отказываясь от ужина с семьей или чашки кофе с десертом.
      - article [ref=f119e107]:
        - generic [ref=f119e108]: ✓
        - heading "Тренировки без фанатизма" [level=3] [ref=f119e109]
        - paragraph [ref=f119e110]: 3 раза в неделю по 40 минут. Мы не делаем из вас олимпийскую чемпионку. Мы даём нагрузку, которая сжигает жир и даёт энергию, а не забирает последние силы.
      - article [ref=f119e111]:
        - generic [ref=f119e112]: ✓
        - heading "Работа с головой, а не только с телом" [level=3] [ref=f119e113]
        - paragraph [ref=f119e114]: Маленькие группы до 6 человек и персональный куратор. Вы не «одна из сотни». Вас знают по имени, поддерживают и ведут за руку до результата.
