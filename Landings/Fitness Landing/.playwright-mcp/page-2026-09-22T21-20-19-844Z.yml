        - paragraph [ref=f119e232]: Дипломированный специалист по клиническому питанию. Разрабатывает рационы не по учебникам 90-х, а с опорой на современные научные данные и ваши гастрономические предпочтения.
      - article [ref=f119e233]:
        - img "Команда кураторов «Спорт-ленд»" [ref=f119e235]
        - heading "Кураторы" [level=3] [ref=f119e236]
