  - generic [ref=f119e76]:
    - generic [ref=f119e77]:
      - heading "Знакомо?" [level=2] [ref=f119e78]
      - paragraph [ref=f119e79]: Мы знаем, как это бывает. Вы ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал... Хватает на две недели. Потом стресс на работе, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f119e80]:
      - article [ref=f119e81]:
        - generic [ref=f119e82]: ↻
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f119e83]
        - paragraph [ref=f119e84]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f119e85]:
        - generic [ref=f119e86]: ⏱
        - heading "«Нет времени и сил»" [level=3] [ref=f119e87]
        - paragraph [ref=f119e88]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f119e89]:
        - generic [ref=f119e90]: ◔
        - heading "«Стыдно и страшно»" [level=3] [ref=f119e91]
        - paragraph [ref=f119e92]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я... Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f119e94]:
      - strong [ref=f119e95]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
  - generic [ref=f119e97]:
    - generic [ref=f119e98]:
      - generic [ref=f119e99]: Наш подход
      - heading "Мы не верим в «волшебные таблетки». Мы верим в систему, которая встраивается в вашу жизнь." [level=2] [ref=f119e100]
      - paragraph [ref=f119e101]: Мы не заставляем вас страдать. Мы учим ваш организм отдавать лишний вес комфортно.
    - generic [ref=f119e102]:
