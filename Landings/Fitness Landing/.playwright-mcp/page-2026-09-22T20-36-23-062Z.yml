    - generic [ref=f103e77]:
      - heading "Знакомо?" [level=2] [ref=f103e78]
      - paragraph [ref=f103e79]: Мы знаем, как это бывает. Вы ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал... Хватает на две недели. Потом стресс на работе, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f103e80]:
      - article [ref=f103e81]:
        - generic [ref=f103e82]: ↻
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f103e83]
        - paragraph [ref=f103e84]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f103e85]:
        - generic [ref=f103e86]: ⏱
        - heading "«Нет времени и сил»" [level=3] [ref=f103e87]
        - paragraph [ref=f103e88]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f103e89]:
        - generic [ref=f103e90]: ◔
        - heading "«Стыдно и страшно»" [level=3] [ref=f103e91]
        - paragraph [ref=f103e92]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я... Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f103e94]:
      - strong [ref=f103e95]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
