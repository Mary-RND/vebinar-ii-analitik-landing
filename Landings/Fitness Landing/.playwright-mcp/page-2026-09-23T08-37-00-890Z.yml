        - button "Вебинар правда бесплатный? В чём подвох?" [ref=f2e333] [cursor=pointer]
        - paragraph [ref=f2e335]: Подвоха нет. Это 60-минутный онлайн-эфир. Мы разбираем привычки, считаем калории и даём план на неделю. Если вам понравится наш подход — вы присоединитесь к программе. Если нет — план останется у вас, и мы расстанемся друзьями.
