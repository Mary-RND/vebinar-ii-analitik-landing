      - heading "Мы не верим в «волшебные таблетки». Мы верим в систему, которая встраивается в вашу жизнь." [level=2] [ref=f116e100]
      - paragraph [ref=f116e101]: Мы не заставляем вас страдать. Мы учим ваш организм отдавать лишний вес комфортно.
