      - heading "Знакомо?" [level=2] [ref=f88e74]
      - paragraph [ref=f88e75]: Мы знаем, как это бывает. Вы ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал... Хватает на две недели. Потом стресс на работе, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f88e76]:
      - article [ref=f88e77]:
        - generic [ref=f88e78]: ↻
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f88e79]
        - paragraph [ref=f88e80]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f88e81]:
        - generic [ref=f88e82]: ⏱
        - heading "«Нет времени и сил»" [level=3] [ref=f88e83]
        - paragraph [ref=f88e84]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f88e85]:
        - generic [ref=f88e86]: ◔
        - heading "«Стыдно и страшно»" [level=3] [ref=f88e87]
        - paragraph [ref=f88e88]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я... Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f88e90]:
      - strong [ref=f88e91]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
