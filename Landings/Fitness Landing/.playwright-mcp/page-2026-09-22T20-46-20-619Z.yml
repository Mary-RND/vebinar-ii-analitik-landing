  - generic [ref=f114e240]:
    - generic [ref=f114e241]:
      - generic [ref=f114e242]: FAQ
      - heading "Отвечаем на частые вопросы" [level=2] [ref=f114e243]
    - generic [ref=f114e244]:
      - generic [ref=f114e245]:
        - button "У меня проблемы со здоровьем / коленями. Мне можно?" [ref=f114e246] [cursor=pointer]
        - paragraph [ref=f114e248]: Да. На диагностике мы учитываем все ваши особенности. Тренер адаптирует каждое упражнение так, чтобы нагрузка шла в мышцы, а не в суставы. (Нужна будет справка от врача о допуске к лёгким нагрузкам).
      - generic [ref=f114e249]:
        - button "Я совсем не умею готовить. Меня научат?" [ref=f114e250] [cursor=pointer]
        - paragraph [ref=f114e252]: Мы не заставляем вас стоять у плиты по 3 часа. Мы даём рецепты, которые готовятся за 10–15 минут, и учим собирать готовые блюда в магазине/кафе так, чтобы они вписывались в вашу норму.
      - generic [ref=f114e253]:
        - button "А если я сорвусь и съем пиццу?" [ref=f114e254] [cursor=pointer]
        - paragraph [ref=f114e256]: "В нашей системе нет понятия «сорвался». Есть правило 80/20: 80% времени вы питаетесь здорово, 20% — едите вкусняшки. Если вы съели пиццу, мы не ругаем вас, а просто корректируем план на следующий день. Без чувства вины."
      - generic [ref=f114e257]:
        - button "Диагностика правда бесплатная? В чём подвох?" [ref=f114e258] [cursor=pointer]
        - paragraph [ref=f114e260]: Подвоха нет. Это 45-минутная Zoom-встреча. Мы знакомимся, отвечаем на ваши вопросы, даём план на неделю. Если вам понравится наш подход — вы присоединитесь к программе. Если нет — план на неделю останется у вас, и мы расстанемся друзьями.
