      - heading "Мы не верим в «волшебные таблетки». Мы верим в систему, которая встраивается в вашу жизнь." [level=2] [ref=f114e100]
      - paragraph [ref=f114e101]: Мы не заставляем вас страдать. Мы учим ваш организм отдавать лишний вес комфортно.
