    - generic [ref=f122e85]:
      - generic [ref=f122e86]: Честно
      - heading "Знакомо?" [level=2] [ref=f122e87]
      - paragraph [ref=f122e88]: Ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал… Хватает на две недели. Потом стресс, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f122e89]:
      - article [ref=f122e90]:
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f122e95]
        - paragraph [ref=f122e96]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f122e97]:
        - heading "«Нет времени и сил»" [level=3] [ref=f122e102]
        - paragraph [ref=f122e103]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f122e104]:
        - heading "«Стыдно и страшно»" [level=3] [ref=f122e109]
        - paragraph [ref=f122e110]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я… Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f122e112]:
      - strong [ref=f122e113]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
