        - img "Михаил, старший тренер" [ref=f126e301]
        - heading "Михаил" [level=3] [ref=f126e302]
        - generic [ref=f126e303]: Старший тренер
        - paragraph [ref=f126e304]: Мастер спорта, 10 лет практики. Специализация — тренировки для новичков и людей с ограничениями по здоровью. Делает здоровые суставы и сильное сердце.
