  - generic [ref=f126e87]:
    - generic [ref=f126e88]:
      - generic [ref=f126e89]: Честно
      - heading "Знакомо?" [level=2] [ref=f126e90]
      - paragraph [ref=f126e91]: Ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал… Хватает на две недели. Потом стресс, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f126e92]:
      - article [ref=f126e93]:
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f126e98]
        - paragraph [ref=f126e99]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f126e100]:
        - heading "«Нет времени и сил»" [level=3] [ref=f126e105]
        - paragraph [ref=f126e106]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f126e107]:
        - heading "«Стыдно и страшно»" [level=3] [ref=f126e112]
        - paragraph [ref=f126e113]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я… Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f126e115]:
      - strong [ref=f126e116]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
