        - img "Ольга, нутрициолог" [ref=f126e307]
        - heading "Ольга" [level=3] [ref=f126e308]
        - generic [ref=f126e309]: Нутрициолог
        - paragraph [ref=f126e310]: Дипломированный специалист по клиническому питанию. Рационы не по учебникам 90-х, а с опорой на науку и ваши гастрономические предпочтения.
      - article [ref=f126e311]:
        - img "Кураторы «Спорт-ленд»" [ref=f126e313]
        - heading "Кураторы" [level=3] [ref=f126e314]
        - generic [ref=f126e315]: Команда поддержки
        - paragraph [ref=f126e316]: Люди, которые сами прошли этот путь. На связи в мессенджерах, поддерживают и радуются каждому вашему грамму, ушедшему со весов.
  - generic [ref=f126e318]:
    - generic [ref=f126e319]:
      - generic [ref=f126e320]: FAQ
      - heading "Частые вопросы" [level=2] [ref=f126e321]
    - generic [ref=f126e322]:
      - generic [ref=f126e323]:
        - button "У меня проблемы со здоровьем / коленями. Мне можно?" [ref=f126e324] [cursor=pointer]
        - paragraph [ref=f126e326]: Да. На диагностике мы учитываем все ваши особенности. Тренер адаптирует каждое упражнение так, чтобы нагрузка шла в мышцы, а не в суставы. (Нужна будет справка от врача о допуске к лёгким нагрузкам).
      - generic [ref=f126e327]:
        - button "Я совсем не умею готовить. Меня научат?" [ref=f126e328] [cursor=pointer]
        - paragraph [ref=f126e330]: Мы не заставляем вас стоять у плиты по 3 часа. Мы даём рецепты, которые готовятся за 10–15 минут, и учим собирать готовые блюда в магазине или кафе так, чтобы они вписывались в вашу норму.
      - generic [ref=f126e331]:
        - button "А если я сорвусь и съем пиццу?" [ref=f126e332] [cursor=pointer]
        - paragraph [ref=f126e334]: "В нашей системе нет понятия «сорвался». Есть правило 80/20: 80% времени вы питаетесь здорово, 20% — едите вкусняшки. Если вы съели пиццу, мы не ругаем вас, а корректируем план на следующий день. Без чувства вины."
      - generic [ref=f126e335]:
        - button "Вебинар правда бесплатный? В чём подвох?" [ref=f126e336] [cursor=pointer]
        - paragraph [ref=f126e338]: Подвоха нет. Это 60-минутный онлайн-эфир. Мы разбираем привычки, считаем калории и даём план на неделю. Если вам понравится наш подход — вы присоединитесь к программе. Если нет — план останется у вас, и мы расстанемся друзьями.
      - generic [ref=f126e339]:
        - button "Когда я увижу результат?" [ref=f126e340] [cursor=pointer]
        - paragraph [ref=f126e342]: "Первые изменения — на 2-й неделе: уходят отёки, появляется лёгкость. За 3 месяца программы клиенты теряют в среднем 8–12 кг без срывов и возврата веса."
