  - generic [ref=e315]:
    - generic [ref=e316]:
      - generic [ref=e317]: FAQ
      - heading "Частые вопросы" [level=2] [ref=e318]
    - generic [ref=e319]:
      - generic [ref=e320]:
        - button "У меня проблемы со здоровьем / коленями. Мне можно?" [ref=e321] [cursor=pointer]
        - paragraph [ref=e323]: Да. На диагностике мы учитываем все ваши особенности. Тренер адаптирует каждое упражнение так, чтобы нагрузка шла в мышцы, а не в суставы. (Нужна будет справка от врача о допуске к лёгким нагрузкам).
      - generic [ref=e324]:
        - button "Я совсем не умею готовить. Меня научат?" [ref=e325] [cursor=pointer]
        - paragraph [ref=e327]: Мы не заставляем вас стоять у плиты по 3 часа. Мы даём рецепты, которые готовятся за 10–15 минут, и учим собирать готовые блюда в магазине или кафе так, чтобы они вписывались в вашу норму.
      - generic [ref=e328]:
        - button "А если я сорвусь и съем пиццу?" [ref=e329] [cursor=pointer]
        - paragraph [ref=e331]: "В нашей системе нет понятия «сорвался». Есть правило 80/20: 80% времени вы питаетесь здорово, 20% — едите вкусняшки. Если вы съели пиццу, мы не ругаем вас, а корректируем план на следующий день. Без чувства вины."
      - generic [ref=e332]:
        - button "Вебинар правда бесплатный? В чём подвох?" [ref=e333] [cursor=pointer]
        - paragraph [ref=e335]: Подвоха нет. Это 60-минутный онлайн-эфир. Мы разбираем привычки, считаем калории и даём план на неделю. Если вам понравится наш подход — вы присоединитесь к программе. Если нет — план останется у вас, и мы расстанемся друзьями.
      - generic [ref=e336]:
        - button "Когда я увижу результат?" [ref=e337] [cursor=pointer]
