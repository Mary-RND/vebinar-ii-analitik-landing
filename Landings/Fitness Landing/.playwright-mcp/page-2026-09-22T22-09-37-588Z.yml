      - generic [ref=f124e317]: FAQ
      - heading "Частые вопросы" [level=2] [ref=f124e318]
    - generic [ref=f124e319]:
      - generic [ref=f124e320]:
        - button "У меня проблемы со здоровьем / коленями. Мне можно?" [ref=f124e321] [cursor=pointer]
        - paragraph [ref=f124e323]: Да. На диагностике мы учитываем все ваши особенности. Тренер адаптирует каждое упражнение так, чтобы нагрузка шла в мышцы, а не в суставы. (Нужна будет справка от врача о допуске к лёгким нагрузкам).
      - generic [ref=f124e324]:
        - button "Я совсем не умею готовить. Меня научат?" [ref=f124e325] [cursor=pointer]
        - paragraph [ref=f124e327]: Мы не заставляем вас стоять у плиты по 3 часа. Мы даём рецепты, которые готовятся за 10–15 минут, и учим собирать готовые блюда в магазине или кафе так, чтобы они вписывались в вашу норму.
      - generic [ref=f124e328]:
        - button "А если я сорвусь и съем пиццу?" [ref=f124e329] [cursor=pointer]
        - paragraph [ref=f124e331]: "В нашей системе нет понятия «сорвался». Есть правило 80/20: 80% времени вы питаетесь здорово, 20% — едите вкусняшки. Если вы съели пиццу, мы не ругаем вас, а корректируем план на следующий день. Без чувства вины."
      - generic [ref=f124e332]:
        - button "Вебинар правда бесплатный? В чём подвох?" [ref=f124e333] [cursor=pointer]
        - paragraph [ref=f124e335]: Подвоха нет. Это 60-минутный онлайн-эфир. Мы разбираем привычки, считаем калории и даём план на неделю. Если вам понравится наш подход — вы присоединитесь к программе. Если нет — план останется у вас, и мы расстанемся друзьями.
      - generic [ref=f124e336]:
        - button "Когда я увижу результат?" [ref=f124e337] [cursor=pointer]
        - paragraph [ref=f124e339]: "Первые изменения — на 2-й неделе: уходят отёки, появляется лёгкость. За 3 месяца программы клиенты теряют в среднем 8–12 кг без срывов и возврата веса."
