  - generic [ref=f118e76]:
    - generic [ref=f118e77]:
      - heading "Знакомо?" [level=2] [ref=f118e78]
      - paragraph [ref=f118e79]: Мы знаем, как это бывает. Вы ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал... Хватает на две недели. Потом стресс на работе, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f118e80]:
      - article [ref=f118e81]:
        - generic [ref=f118e82]: ↻
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f118e83]
        - paragraph [ref=f118e84]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f118e85]:
        - generic [ref=f118e86]: ⏱
        - heading "«Нет времени и сил»" [level=3] [ref=f118e87]
        - paragraph [ref=f118e88]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f118e89]:
        - generic [ref=f118e90]: ◔
        - heading "«Стыдно и страшно»" [level=3] [ref=f118e91]
        - paragraph [ref=f118e92]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я... Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f118e94]:
      - strong [ref=f118e95]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
  - generic [ref=f118e97]:
    - generic [ref=f118e98]:
      - generic [ref=f118e99]: Наш подход
      - heading "Мы не верим в «волшебные таблетки». Мы верим в систему, которая встраивается в вашу жизнь." [level=2] [ref=f118e100]
      - paragraph [ref=f118e101]: Мы не заставляем вас страдать. Мы учим ваш организм отдавать лишний вес комфортно.
    - generic [ref=f118e102]:
      - article [ref=f118e103]:
        - generic [ref=f118e104]: ✓
        - heading "Никаких запретов" [level=3] [ref=f118e105]
        - paragraph [ref=f118e106]: Нутрициолог собирает рацион из ваших любимых продуктов. Вы худеете, не отказываясь от ужина с семьей или чашки кофе с десертом.
      - article [ref=f118e107]:
        - generic [ref=f118e108]: ✓
        - heading "Тренировки без фанатизма" [level=3] [ref=f118e109]
        - paragraph [ref=f118e110]: 3 раза в неделю по 40 минут. Мы не делаем из вас олимпийскую чемпионку. Мы даём нагрузку, которая сжигает жир и даёт энергию, а не забирает последние силы.
      - article [ref=f118e111]:
        - generic [ref=f118e112]: ✓
        - heading "Работа с головой, а не только с телом" [level=3] [ref=f118e113]
        - paragraph [ref=f118e114]: Маленькие группы до 6 человек и персональный куратор. Вы не «одна из сотни». Вас знают по имени, поддерживают и ведут за руку до результата.
