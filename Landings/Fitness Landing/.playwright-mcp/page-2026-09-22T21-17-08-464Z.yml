        - generic [ref=f118e125]:
          - heading "Умное питание" [level=3] [ref=f118e126]
          - paragraph [ref=f118e127]: Мы не даём жёсткое меню «ешьте только это». Мы рассчитываем ваш персональный коридор калорий и БЖУ, учим собирать тарелку, выбирать продукты в магазине и готовить быстро (буквально 15 минут на завтрак и ужин).
      - article [ref=f118e128]:
