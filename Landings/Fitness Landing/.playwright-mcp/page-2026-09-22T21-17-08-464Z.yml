          - heading "Поддержка 24/7" [level=3] [ref=f118e140]
          - paragraph [ref=f118e141]: Ваш куратор в чате. Задали вопрос по продукту в магазине? Скинули фото тарелки? Не хочется идти на тренировку? Мы рядом. Мы помогаем пройти через «ямы» и срывы, превращая их в опыт, а не в повод бросить всё.
