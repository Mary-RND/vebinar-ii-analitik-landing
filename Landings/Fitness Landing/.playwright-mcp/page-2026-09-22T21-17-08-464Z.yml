        - generic [ref=f118e225]: Старший тренер
        - paragraph [ref=f118e226]: Мастер спорта, 10 лет практики. Специализация — тренировки для новичков и людей с ограничениями по здоровью. Не делает из клиентов «бицепсы», делает здоровые суставы и сильное сердце.
