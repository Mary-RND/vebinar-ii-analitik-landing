          - paragraph [ref=f118e134]: Забудьте про «качалочный» сленг и штанги, которые больше вашего веса. Тренер подбирает программу под ваш уровень, состояние суставов и спины. Вы будете двигаться с удовольствием, а не через боль.
      - article [ref=f118e135]:
        - generic [ref=f118e136]:
          - 'img "Поддержка 24/7: куратор на связи в чате" [ref=f118e137]'
