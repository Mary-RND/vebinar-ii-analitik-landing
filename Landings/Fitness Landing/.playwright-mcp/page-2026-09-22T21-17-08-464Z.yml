        - generic [ref=f118e231]: Нутрициолог
        - paragraph [ref=f118e232]: Дипломированный специалист по клиническому питанию. Разрабатывает рационы не по учебникам 90-х, а с опорой на современные научные данные и ваши гастрономические предпочтения.
      - article [ref=f118e233]:
        - img "Команда кураторов «Спорт-ленд»" [ref=f118e235]
        - heading "Кураторы" [level=3] [ref=f118e236]
