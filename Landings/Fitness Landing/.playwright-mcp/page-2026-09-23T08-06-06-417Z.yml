    - generic [ref=f128e85]:
      - generic [ref=f128e86]: Честно
      - heading "Знакомо?" [level=2] [ref=f128e87]
      - paragraph [ref=f128e88]: Ставите будильник на 6 утра, покупаете куриную грудку и брокколи, записываетесь в зал… Хватает на две недели. Потом стресс, бокал вина, кусок торта — и чувство вины. Вы бросаете, а вес возвращается с бонусом.
    - generic [ref=f128e89]:
      - article [ref=f128e90]:
        - heading "«Я уже всё перепробовала»" [level=3] [ref=f128e95]
        - paragraph [ref=f128e96]: Сидела на гречке, считала калории в приложениях, покупала абонемент. Я устала быть в этой петле «диета-срыв-самобичевание».
      - article [ref=f128e97]:
        - heading "«Нет времени и сил»" [level=3] [ref=f128e102]
        - paragraph [ref=f128e103]: Работа, дети, быт. К вечеру я как выжатый лимон. Какой спортзал? Мне бы до дивана дойти. А готовить себе отдельно — это же трата времени.
      - article [ref=f128e104]:
        - heading "«Стыдно и страшно»" [level=3] [ref=f128e109]
        - paragraph [ref=f128e110]: В зале чувствую себя не в своей тарелке. Все подтянутые, а я… Начинаю каждый раз «с понедельника», а в пятницу уже ем сладкое и ненавижу себя в зеркале.
    - paragraph [ref=f128e112]:
      - strong [ref=f128e113]: Дело не в вас.
      - text: Дело не в отсутствии силы воли. Дело в том, что старые методы заставляют вас работать против своей природы.
